name: ChatGPT temporary ZZZ video 2 retrieval

on:
  push:
    branches:
      - chatgpt-temp-zzz-video2-20260729
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch-and-split:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install downloader
        run: python -m pip install --disable-pip-version-check --quiet gdown

      - name: Download public Google Drive recording
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -f video2.mp4
            if gdown "https://drive.google.com/uc?id=19WKiwQ7JRFJVUrF9Vs6cTE3oMSp70Y3o" -O video2.mp4; then
              break
            fi
            sleep 10
          done
          test -f video2.mp4
          actual_size="$(stat -c%s video2.mp4)"
          echo "Downloaded size: ${actual_size} bytes"
          test "${actual_size}" -eq 538704500

      - name: Split and verify
        shell: bash
        run: |
          set -euo pipefail
          split -b 94371840 -d -a 2 video2.mp4 zzz-v2-part-
          test "$(find . -maxdepth 1 -name 'zzz-v2-part-*' | wc -l)" -eq 6
          sha256sum video2.mp4 > video2.sha256
          stat -c '%n %s' zzz-v2-part-* > parts-sizes.txt
          sha256sum zzz-v2-part-* > parts-sha256.txt
          cat video2.sha256 parts-sizes.txt parts-sha256.txt > manifest.txt
          cat manifest.txt

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: zzz-v2-part-00
          path: zzz-v2-part-00
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: zzz-v2-part-01
          path: zzz-v2-part-01
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: zzz-v2-part-02
          path: zzz-v2-part-02
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: zzz-v2-part-03
          path: zzz-v2-part-03
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: zzz-v2-part-04
          path: zzz-v2-part-04
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with:
          name: zzz-v2-part-05
          path: zzz-v2-part-05
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: zzz-v2-manifest
          path: manifest.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
