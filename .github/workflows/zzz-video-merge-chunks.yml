name: Temporary ZZZ video merge chunks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  merge-and-split:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade gdown

      - name: Download five public recordings in chronological order
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input output/chunks
          python - <<'PY'
          import pathlib
          import gdown
          files = [
              ("1RlpjMNmazVx7eGYuAUevHyTNrqZoBMC8", "01.mp4"),
              ("19WKiwQ7JRFJVUrF9Vs6cTE3oMSp70Y3o", "02.mp4"),
              ("1gaOnX_1_8PLgY_CZO3Ib41_hR6-k-EDh", "03.mp4"),
              ("1Fo7TvugQMlHgRmowl8yAl6m_7ebjY_hB", "04.mp4"),
              ("1DeDs0Rn8PDht5EJD22mQpoHbPyBNxkGa", "05.mp4"),
          ]
          for file_id, name in files:
              path = pathlib.Path("input") / name
              result = gdown.download(id=file_id, output=str(path), quiet=False)
              if result is None or not path.exists() or path.stat().st_size < 1_000_000:
                  raise RuntimeError(f"Download failed: {name}")
              print(name, path.stat().st_size)
          PY

      - name: Concatenate directly and split into transport chunks
        shell: bash
        run: |
          set -euo pipefail
          cat > concat.txt <<'EOF'
          file 'input/01.mp4'
          file 'input/02.mp4'
          file 'input/03.mp4'
          file 'input/04.mp4'
          file 'input/05.mp4'
          EOF

          OUT='output/ZZZ_3.1_丹_6加1_完整抽卡记录_20260728_按时间拼接.mp4'
          ffmpeg -hide_banner -y -f concat -safe 0 -i concat.txt \
            -map 0:v:0 -map 0:a:0? -c copy -avoid_negative_ts make_zero -movflags +faststart "$OUT"

          ffprobe -v error \
            -show_entries format=duration,size:stream=index,codec_type,codec_name,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels \
            -of default=noprint_wrappers=1 "$OUT" > output/merged_metadata.txt
          sha256sum "$OUT" > output/WHOLE_SHA256SUM.txt
          split -b 400M -d -a 2 "$OUT" 'output/chunks/ZZZ_merged.mp4.part'
          sha256sum output/chunks/* > output/PART_SHA256SUMS.txt
          stat -c '%n %s bytes' output/chunks/* > output/PART_SIZES.txt
          test "$(find output/chunks -type f | wc -l)" -eq 5
          rm "$OUT"

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: zzz-merged-part-00
          path: output/chunks/ZZZ_merged.mp4.part00
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: zzz-merged-part-01
          path: output/chunks/ZZZ_merged.mp4.part01
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: zzz-merged-part-02
          path: output/chunks/ZZZ_merged.mp4.part02
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: zzz-merged-part-03
          path: output/chunks/ZZZ_merged.mp4.part03
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: zzz-merged-part-04
          path: output/chunks/ZZZ_merged.mp4.part04
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: zzz-merged-metadata
          path: |
            output/merged_metadata.txt
            output/WHOLE_SHA256SUM.txt
            output/PART_SHA256SUMS.txt
            output/PART_SIZES.txt
          if-no-files-found: error
          retention-days: 1
