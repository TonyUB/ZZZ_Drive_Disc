name: Temporary ZZZ video merge fast

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  merge-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade gdown

      - name: Download five public Google Drive recordings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input output
          python - <<'PY'
          import pathlib
          import gdown
          files = [
              ("1RlpjMNmazVx7eGYuAUevHyTNrqZoBMC8", "01.mp4"),
              ("19WKiwQ7JRFJVUrF9Vs6cTE3oMSp70Y3o", "02.mp4"),
              ("1gaOnX_1_8PLgY_CZO3Ib41_hR6-k-EDh", "03.mp4"),
              ("1Fo7TvugQMlHgRmowl8yAl6m_7ebjY_hB", "04.mp4"),
              ("1DeDs0Rn8PDht5EJD22mQpoHbPyBNxkGa", "05.mp4"),
          ]
          for file_id, name in files:
              path = pathlib.Path("input") / name
              result = gdown.download(id=file_id, output=str(path), quiet=False)
              if result is None or not path.exists() or path.stat().st_size < 1_000_000:
                  raise RuntimeError(f"Download failed: {name}")
              print(name, path.stat().st_size)
          PY

      - name: Concatenate by internal recording time without cuts or re-encoding
        shell: bash
        run: |
          set -euo pipefail
          cat > concat.txt <<'EOF'
          file 'input/01.mp4'
          file 'input/02.mp4'
          file 'input/03.mp4'
          file 'input/04.mp4'
          file 'input/05.mp4'
          EOF
          OUT='output/ZZZ_3.1_丹_6加1_完整抽卡记录_20260728_按时间拼接.mp4'
          ffmpeg -hide_banner -y -f concat -safe 0 -i concat.txt \
            -map 0:v:0 -map 0:a:0? -c copy -avoid_negative_ts make_zero -movflags +faststart "$OUT"
          ffprobe -v error -show_entries format=duration,size \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels \
            -of default=noprint_wrappers=1 "$OUT" > output/merged_metadata.txt
          sha256sum "$OUT" > output/SHA256SUMS.txt
          stat -c '%n %s bytes' "$OUT" > output/file_size.txt

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: zzz-merged-video-fast
          path: output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
